apiVersion: v1
kind: Service
metadata:
  name: kafka  # Notice the name is 'kafka'. This is how the Worker finds it!
spec:
  selector:
    app: kafka
  ports:
    - name: internal
      protocol: TCP
      port: 9092
      targetPort: 9092
    - name: external
      protocol: TCP
      port: 29092
      targetPort: 29092