apiVersion: apps/v1
kind: Deployment
metadata:
  name: primary-backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: primary-backend
  template:
    metadata:
      labels:
        app: primary-backend
    spec:
      containers:
      - name: primary-backend
        image: yuvraj2130/zapier-backend:latest
        args: ["pnpm", "--filter", "primary-backend", "run", "dev"]
        ports:
        - containerPort: 3001
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)"
        - name: JWT_SECRET
          value: "fallbackpassword" # You can move this to a K8s secret later too!