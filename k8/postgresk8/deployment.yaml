apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: "zapier_user"
        - name: POSTGRES_PASSWORD
          value: "zapier_super_secret_password"
        - name: POSTGRES_DB
          value: "zapier_db"
        ports:
        - containerPort: 5432
