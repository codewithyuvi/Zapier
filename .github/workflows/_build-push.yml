name: Resuable Workflow Build and Push Docker Image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      dockerfile:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # add this step to log into your Docker Hub account securely
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push the Docker Image
      run: |
        docker build . --file ${{inputs.dockerfile}} --tag ${{secrets.DOCKERHUB_USERNAME}}/zapier-${{inputs.service}}:latest
        docker push ${{secrets.DOCKERHUB_USERNAME}}/zapier-${{inputs.service}}:latest